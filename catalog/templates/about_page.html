<!-- { ключ из контекста }x2 -->
<h1> {{ names }} </h1>

<ol>
    {% for n in names %}
    <li> {{ n }} </li>
    {% empty %}
    <b>Список имен пустой</b>
    {% endfor %}
</ol>

<h2><i>
    {{random_number}}

    {% if is_even %}
         (Четное число)
    {% else %}
         (Начотное число)
    {% endif %}
</i></h2>
